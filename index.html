<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Goals — Strawberry & Nude Notion Embed</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js" crossorigin="anonymous"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'Georgia', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        berry: {
                            50: '#fdf2f4',
                            100: '#fbe6eb',
                            200: '#f7d0dc',
                            500: '#e07a93',
                            700: '#9e3b52',
                        },
                        nude: {
                            50: '#faf7f5',
                            100: '#f3ece7',
                            200: '#e8dbd0',
                            300: '#d5c2b3',
                            800: '#524339',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Transparent body layout optimal for Notion iframe embedding */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: transparent;
            min-height: 100vh;
            color: #4a3843;
            margin: 0;
            padding: 0.5rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
        }

        /* Enhanced Glass Water Effect (Water Glassmorphism) */
        .glass-water-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 240, 243, 0.45) 50%, rgba(255, 255, 255, 0.55) 100%);
            backdrop-filter: blur(20px) saturate(200%);
            -webkit-backdrop-filter: blur(20px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-top: 1.5px solid rgba(255, 255, 255, 0.95);
            border-left: 1.5px solid rgba(255, 255, 255, 0.95);
            box-shadow: 
                0 12px 35px 0 rgba(198, 160, 172, 0.18),
                inset 0 2px 4px 0 rgba(255, 255, 255, 0.9),
                inset 0 -2px 6px 0 rgba(224, 122, 147, 0.08);
            position: relative;
            overflow: hidden;
        }

        /* Dynamic Liquid Refraction Highlight overlay */
        .glass-water-panel::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 60%);
            pointer-events: none;
            animation: liquidShimmer 12s infinite linear;
        }

        @keyframes liquidShimmer {
            0% { transform: rotate(0deg) translate(-2%, -2%); }
            50% { transform: rotate(180deg) translate(2%, 2%); }
            100% { transform: rotate(360deg) translate(-2%, -2%); }
        }

        .glass-card {
            backdrop-filter: blur(14px) saturate(160%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            border-top: 1px solid rgba(255, 255, 255, 0.9) !important;
            border-left: 1px solid rgba(255, 255, 255, 0.8) !important;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .glass-card:hover {
            transform: translateY(-2px) scale(1.003);
            box-shadow: 0 8px 20px -4px rgba(224, 122, 147, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.95);
        }

        /* Drag & Drop Visuals */
        .glass-card[draggable="true"] {
            cursor: grab;
        }
        .glass-card.dragging {
            opacity: 0.35;
            transform: scale(0.98);
        }
        .category-dropzone {
            min-height: 48px;
            transition: all 0.2s ease;
            border-radius: 14px;
        }
        .category-dropzone.drag-over {
            background: rgba(255, 255, 255, 0.55);
            border: 2px dashed rgba(224, 122, 147, 0.6);
            box-shadow: inset 0 0 10px rgba(224, 122, 147, 0.15);
        }

        /* Category Card Tone Variations with Glass Gloss */
        .card-quick {
            background: linear-gradient(135deg, rgba(254, 249, 231, 0.75), rgba(253, 243, 206, 0.45));
            border: 1px solid rgba(247, 235, 184, 0.8);
        }
        .card-small {
            background: linear-gradient(135deg, rgba(238, 247, 241, 0.75), rgba(215, 237, 222, 0.45));
            border: 1px solid rgba(205, 232, 213, 0.8);
        }
        .card-big {
            background: linear-gradient(135deg, rgba(240, 241, 250, 0.75), rgba(220, 224, 245, 0.45));
            border: 1px solid rgba(214, 218, 240, 0.8);
        }
        .card-future {
            background: linear-gradient(135deg, rgba(245, 239, 235, 0.75), rgba(232, 220, 210, 0.45));
            border: 1px solid rgba(227, 216, 206, 0.8);
        }

        /* Subtle gentle floating motion */
        @keyframes gentleFloat1 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2px); } }
        @keyframes gentleFloat2 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2.5px); } }
        @keyframes gentleFloat3 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-1.5px); } }

        .float-1 { animation: gentleFloat1 6s ease-in-out infinite; }
        .float-2 { animation: gentleFloat2 7.5s ease-in-out infinite; }
        .float-3 { animation: gentleFloat3 6.8s ease-in-out infinite; }

        /* Flower Blossom Glowing Button */
        .flower-btn {
            opacity: 0.5;
            filter: grayscale(25%);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .flower-btn:hover {
            opacity: 0.9;
            transform: scale(1.15) rotate(10deg);
        }
        .flower-btn.active {
            opacity: 1;
            filter: grayscale(0%) drop-shadow(0 0 8px rgba(247, 180, 200, 0.9));
            transform: scale(1.18);
        }

        /* Contenteditable focus glow */
        /* Custom subtle scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(224, 122, 147, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(224, 122, 147, 0.5); }

        /* Smooth scrolling physics & containment to prevent UI layout jumps */
        #goals-container {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            will-change: transform, scroll-position;
        }

        #water-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="selection:bg-pink-100 selection:text-pink-900">

    <!-- Interactive Liquid Water Canvas Backdrop -->
    <canvas id="water-canvas"></canvas>

    <!-- Ultra-Compact Wide Water-Glass Panel for Notion -->
    <div class="relative z-10 w-full max-w-2xl rounded-[24px] glass-water-panel p-3.5 sm:p-4 flex flex-col gap-2.5 transition-all duration-300">
        
        <!-- Header Section -->
        <div class="flex items-center justify-between gap-2 px-1 pb-1 border-b border-white/60">
            <div class="flex items-baseline gap-2">
                <h1 class="font-serif text-xl sm:text-2xl font-normal text-[#3f2e37] tracking-tight flex items-center gap-1.5">
                    <span>My Goals</span>
                    <span class="text-xs font-sans text-pink-400 font-light">🍓</span>
                </h1>
                <span class="font-sans font-light text-[11px] sm:text-xs text-[#8c6d7a] italic hidden sm:inline">small steps → big life</span>
            </div>
            
            <div class="flex items-center gap-1.5">
                <span class="text-[11px] font-light text-[#7a5e6a] bg-white/70 backdrop-blur-md px-2.5 py-0.5 rounded-full border border-white/80 shadow-2xs" id="total-count-badge">
                    0 goals
                </span>
                <button onclick="triggerSplashEffect()" title="Create water drop ripple" class="text-xs bg-white/70 hover:bg-white p-1 rounded-full border border-white/90 transition-all active:scale-95 text-[#8c6d7a] shadow-2xs">
                    💧
                </button>
            </div>
        </div>

        <!-- Compact Add Goal Input Row -->
        <div class="rounded-xl bg-white/40 border border-white/70 p-2 shadow-inner backdrop-blur-md flex items-center gap-2">
            <input type="text" id="goal-input" placeholder="What do you want to make happen?..." 
                   class="flex-grow min-w-0 bg-transparent font-sans font-light text-xs sm:text-sm text-[#4a3540] placeholder-[#b096a1] outline-none px-1.5"
                   onkeydown="if(event.key==='Enter') addGoal()">

            <!-- Category Selectors -->
            <div class="flex items-center gap-1 overflow-x-auto py-0.5 no-scrollbar flex-shrink-0">
                <button type="button" onclick="selectCategory('quick')" id="cat-btn-quick" 
                        class="cat-select-btn text-[10px] sm:text-xs font-normal px-2 py-0.5 rounded-full bg-[#FEF9E7]/90 text-[#8a721a] border border-[#F7EBB8] transition-all hover:scale-105">
                    🍋 Quick
                </button>
                <button type="button" onclick="selectCategory('small')" id="cat-btn-small" 
                        class="cat-select-btn text-[10px] sm:text-xs font-normal px-2 py-0.5 rounded-full bg-[#EEF7F1]/90 text-[#3b734c] border border-[#CDE8D5] transition-all hover:scale-105 ring-1 ring-[#88c499]">
                    🥑 Small
                </button>
                <button type="button" onclick="selectCategory('big')" id="cat-btn-big" 
                        class="cat-select-btn text-[10px] sm:text-xs font-normal px-2 py-0.5 rounded-full bg-[#F0F1FA]/90 text-[#3e4882] border border-[#D6DAF0] transition-all hover:scale-105">
                    🫐 Big
                </button>
                <button type="button" onclick="selectCategory('future')" id="cat-btn-future" 
                        class="cat-select-btn text-[10px] sm:text-xs font-normal px-2 py-0.5 rounded-full bg-[#F5EFEB]/90 text-[#705e54] border border-[#E3D8CE] transition-all hover:scale-105">
                    ☕️ Future
                </button>
            </div>

            <!-- Add Button -->
            <button onclick="addGoal()" class="bg-[#4a3843] hover:bg-[#33242d] text-white font-sans font-light text-xs px-3 py-1 rounded-full shadow-xs transition-all active:scale-95 flex-shrink-0">
                + Add
            </button>
        </div>

        <!-- Compact Filter Bar -->
        <div class="flex items-center gap-1 overflow-x-auto text-[11px] font-light text-[#7a5e6a] border-b border-white/50 pb-1">
            <button onclick="setFilter('all')" id="filter-all" class="filter-pill px-2.5 py-0.5 rounded-full bg-[#4a3843] text-white shadow-2xs transition-all">All</button>
            <button onclick="setFilter('quick')" id="filter-quick" class="filter-pill px-2.5 py-0.5 rounded-full bg-white/50 hover:bg-white/80 transition-all">🍋 Quick</button>
            <button onclick="setFilter('small')" id="filter-small" class="filter-pill px-2.5 py-0.5 rounded-full bg-white/50 hover:bg-white/80 transition-all">🥑 Small</button>
            <button onclick="setFilter('big')" id="filter-big" class="filter-pill px-2.5 py-0.5 rounded-full bg-white/50 hover:bg-white/80 transition-all">🫐 Big</button>
            <button onclick="setFilter('future')" id="filter-future" class="filter-pill px-2.5 py-0.5 rounded-full bg-white/50 hover:bg-white/80 transition-all">☕️ Future</button>
            <button onclick="setFilter('done')" id="filter-done" class="filter-pill px-2.5 py-0.5 rounded-full bg-white/50 hover:bg-white/80 transition-all">🌸 Done</button>
        </div>

        <!-- Goals Container with tight height for Notion -->
        <div id="goals-container" class="flex flex-col gap-2 max-h-[50vh] overflow-y-auto pr-0.5">
            <!-- Dynamic Goals Render Here -->
        </div>

    </div>

    <script>
        // Category configuration
        const categories = {
            quick: { label: '🍋 Quick', cardClass: 'card-quick', textColor: '#6e5a17' },
            small: { label: '🥑 Small', cardClass: 'card-small', textColor: '#2d593a' },
            big: { label: '🫐 Big', cardClass: 'card-big', textColor: '#2e386b' },
            future: { label: '☕️ Future', cardClass: 'card-future', textColor: '#5c4b42' }
        };

        const defaultGoals = [
            { id: 1, title: "Self-Care & Makeup Routine", category: "small", micro: "Clean makeup brushes & organize aesthetic tray", done: false },
            { id: 2, title: "Launch Notion Sale Page", category: "big", micro: "Refine cover art & publish digital templates", done: false },
            { id: 3, title: "Morning matcha ritual", category: "quick", micro: "Whisk matcha powder with warm water", done: true },
            { id: 4, title: "Design autumn capsule wardrobe", category: "future", micro: "Save 5 inspiring Pinterest outfit boards", done: false }
        ];

        let state = loadData();
        let activeCategoryToAdd = 'small';
        let activeFilter = 'all';
        let draggedGoalId = null;

        function loadData() {
            const saved = localStorage.getItem('my_aesthetic_goals_v3');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) {}
            }
            return defaultGoals;
        }

        function saveData() {
            localStorage.setItem('my_aesthetic_goals_v3', JSON.stringify(state));
            render();
        }

        function selectCategory(cat) {
            activeCategoryToAdd = cat;
            document.querySelectorAll('.cat-select-btn').forEach(btn => {
                btn.classList.remove('ring-1', 'ring-[#88c499]', 'ring-[#88a0c4]', 'ring-[#c4b588]', 'ring-[#b5a396]', 'ring-[#705e54]');
            });
            const selectedBtn = document.getElementById(`cat-btn-${cat}`);
            if (selectedBtn) {
                selectedBtn.classList.add('ring-1', 'ring-[#705e54]');
            }
        }

        function setFilter(filter) {
            activeFilter = filter;
            document.querySelectorAll('.filter-pill').forEach(btn => {
                btn.classList.remove('bg-[#4a3843]', 'text-white', 'shadow-2xs');
                btn.classList.add('bg-white/50', 'text-[#7a5e6a]');
            });
            const activeBtn = document.getElementById(`filter-${filter}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-[#4a3843]', 'text-white', 'shadow-2xs');
                activeBtn.classList.remove('bg-white/50', 'text-[#7a5e6a]');
            }
            render();
        }

        function addGoal() {
            const input = document.getElementById('goal-input');
            const title = input.value.trim();
            if (!title) return;

            const newGoal = {
                id: Date.now(),
                title: title,
                category: activeCategoryToAdd,
                micro: "Add a 2-minute step...",
                done: false
            };

            state.unshift(newGoal);
            input.value = '';
            saveData();
        }

        function toggleComplete(id, e) {
            if (e) e.stopPropagation();
            const goal = state.find(g => g.id === id);
            if (goal) {
                goal.done = !goal.done;
                if (goal.done) {
                    confetti({
                        particleCount: 25,
                        spread: 40,
                        origin: { y: 0.6 },
                        colors: ['#f7d0dc', '#EEF7F1', '#FEF9E7', '#e8dbd0']
                    });
                }
                saveData();
            }
        }

        function deleteGoal(id, e) {
            if (e) e.stopPropagation();
            state = state.filter(g => g.id !== id);
            saveData();
        }

        function updateGoalTitle(id, text) {
            const goal = state.find(g => g.id === id);
            if (goal) {
                goal.title = text.trim() || "Untitled Goal";
                localStorage.setItem('my_aesthetic_goals_v3', JSON.stringify(state));
            }
        }

        function updateGoalMicro(id, text) {
            const goal = state.find(g => g.id === id);
            if (goal) {
                goal.micro = text.trim() || "Add a 2-minute step...";
                localStorage.setItem('my_aesthetic_goals_v3', JSON.stringify(state));
            }
        }

        function toggleDrawer(id, e) {
            if (e) e.stopPropagation();
            const drawer = document.getElementById(`drawer-${id}`);
            if (drawer) drawer.classList.toggle('hidden');
        }

        function changeGoalCategory(id, newCategory, e) {
            if (e) e.stopPropagation();
            const goal = state.find(g => g.id === id);
            if (goal && goal.category !== newCategory) {
                goal.category = newCategory;
                // Preserve scroll position during category shift
                const container = document.getElementById('goals-container');
                const scrollPos = container.scrollTop;
                saveData();
                container.scrollTop = scrollPos;
            }
        }

        // Drag and Drop Event Handlers optimized for zero layout jitter
        function handleDragStart(e, id) {
            draggedGoalId = id;
            e.dataTransfer.setData('text/plain', id.toString());
            e.dataTransfer.effectAllowed = 'move';
            e.currentTarget.classList.add('dragging');
        }

        function handleDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.category-dropzone').forEach(dz => dz.classList.remove('drag-over'));
            draggedGoalId = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e, targetCategory) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const id = parseInt(e.dataTransfer.getData('text/plain') || draggedGoalId, 10);
            if (!id) return;

            const goal = state.find(g => g.id === id);
            if (goal && goal.category !== targetCategory) {
                goal.category = targetCategory;
                const container = document.getElementById('goals-container');
                const scrollPos = container.scrollTop;
                saveData();
                container.scrollTop = scrollPos;
            }
        }

        function render() {
            const container = document.getElementById('goals-container');
            container.innerHTML = '';

            let filtered = state;
            if (activeFilter === 'done') {
                filtered = state.filter(g => g.done);
            } else if (activeFilter !== 'all') {
                filtered = state.filter(g => g.category === activeFilter && !g.done);
            }

            const activeCount = state.filter(g => !g.done).length;
            document.getElementById('total-count-badge').innerText = `${activeCount} active`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-6 font-serif text-xs text-[#a88d98] italic">
                        No goals found ~ ✨
                    </div>`;
                return;
            }

            const groups = (activeFilter === 'all') 
                ? ['quick', 'small', 'big', 'future'] 
                : [activeFilter];

            const floatClasses = ['float-1', 'float-2', 'float-3'];

            groups.forEach(catKey => {
                const catGoals = filtered.filter(g => activeFilter === 'done' || g.category === catKey);
                const catInfo = categories[catKey] || categories.small;

                // Section Wrapper & Header (always rendered in section mode for easy drop targets)
                const sectionEl = document.createElement('div');
                sectionEl.className = 'flex flex-col gap-1.5 mb-1';

                if (activeFilter === 'all' || activeFilter === 'done') {
                    sectionEl.innerHTML = `
                        <div class="flex items-center gap-1.5 pt-1 pb-0.5 px-0.5">
                            <span class="font-sans font-medium text-[10px] tracking-wide text-[#6e5662] uppercase">${catInfo.label}</span>
                            <span class="text-[9px] font-light text-[#8c6d7a] bg-white/80 px-1.5 py-0.2 rounded-full">${catGoals.length}</span>
                            <div class="flex-grow h-[1px] bg-gradient-to-r from-white/80 to-transparent"></div>
                            <span class="text-[9px] font-light text-[#a88d98] italic hidden sm:inline">drag items here ↘</span>
                        </div>
                    `;
                }

                // Dropzone area for goals in this category
                const dropzone = document.createElement('div');
                dropzone.className = 'category-dropzone flex flex-col gap-2 p-1';
                dropzone.ondragover = handleDragOver;
                dropzone.ondragleave = handleDragLeave;
                dropzone.ondrop = (e) => handleDrop(e, catKey);

                if (catGoals.length === 0 && activeFilter === 'all') {
                    dropzone.innerHTML = `
                        <div class="text-center py-2 border border-dashed border-white/60 rounded-xl text-[10px] text-[#a88d98] italic">
                            Drop goals here to make them ${catInfo.label.split(' ')[1]}
                        </div>`;
                }

                catGoals.forEach((goal, idx) => {
                    const card = document.createElement('div');
                    const floatClass = floatClasses[idx % floatClasses.length];
                    const catData = categories[goal.category] || categories.small;

                    card.className = `glass-card rounded-xl p-2.5 ${catData.cardClass} ${floatClass} transition-all duration-200 group relative`;
                    card.setAttribute('draggable', 'true');
                    card.ondragstart = (e) => handleDragStart(e, goal.id);
                    card.ondragend = handleDragEnd;

                    if (goal.done) {
                        card.classList.add('opacity-60');
                    }

                    // Options for changing category via dropdown tag click
                    const otherCats = Object.keys(categories)
                        .map(k => `<option value="${k}" ${k === goal.category ? 'selected' : ''}>${categories[k].label}</option>`)
                        .join('');

                    card.innerHTML = `
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2 flex-grow min-w-0 cursor-pointer" onclick="toggleComplete(${goal.id}, event)">
                                <!-- Category Select Badge -->
                                <div class="flex-shrink-0 relative group/select" onclick="event.stopPropagation()">
                                    <select onchange="changeGoalCategory(${goal.id}, this.value, event)" 
                                            class="appearance-none text-[10px] bg-white/80 hover:bg-white text-[#4a3540] font-medium px-2 py-0.5 pr-3.5 rounded-lg shadow-2xs border border-white/90 outline-none cursor-pointer transition-all">
                                        ${otherCats}
                                    </select>
                                    <span class="absolute right-1 top-1/2 -translate-y-1/2 text-[8px] text-[#7a5e6a] pointer-events-none">▾</span>
                                </div>

                                <div class="flex-grow min-w-0">
                                    <h2 contenteditable="true" 
                                        onblur="updateGoalTitle(${goal.id}, this.innerText)" 
                                        onclick="event.stopPropagation()" 
                                        class="font-serif text-sm font-normal text-[#3f2e37] ${goal.done ? 'line-through text-[#8c7480]' : ''} outline-none leading-tight truncate">
                                        ${goal.title}
                                    </h2>
                                </div>
                            </div>

                            <div class="flex items-center gap-1.5 flex-shrink-0">
                                <span class="text-[10px] text-[#9c828e] cursor-grab active:cursor-grabbing px-1 opacity-60 hover:opacity-100" title="Drag to reorder section">⋮⋮</span>
                                <button onclick="toggleDrawer(${goal.id}, event)" class="text-[10px] font-light text-[#6e5662] bg-white/80 hover:bg-white px-2 py-0.5 rounded-full shadow-2xs transition-all flex items-center gap-0.5 border border-white/60">
                                    <span>⚡ step</span>
                                </button>
                                <button onclick="toggleComplete(${goal.id}, event)" title="Toggle status" class="flower-btn text-base ${goal.done ? 'active' : ''} p-0.5">
                                    🌸
                                </button>
                                <button onclick="deleteGoal(${goal.id}, event)" title="Delete goal" class="text-xs text-[#b89ca8] hover:text-[#785060] opacity-0 group-hover:opacity-100 transition-opacity px-1">
                                    ✕
                                </button>
                            </div>
                        </div>

                        <!-- Micro Step Drawer -->
                        <div id="drawer-${goal.id}" class="hidden mt-2 pt-1.5 border-t border-black/5 text-[11px]">
                            <div class="text-[9px] uppercase font-medium tracking-wider text-[#8a707c] mb-0.5">⚡ 2-Min Micro Step:</div>
                            <div contenteditable="true" 
                                 onblur="updateGoalMicro(${goal.id}, this.innerText)" 
                                 class="font-sans font-light text-xs text-[#523e47] bg-white/70 backdrop-blur-sm p-1.5 rounded-lg border border-white/80 outline-none">
                                ${goal.micro}
                            </div>
                        </div>
                    `;
                    dropzone.appendChild(card);
                });

                sectionEl.appendChild(dropzone);
                container.appendChild(sectionEl);
            });
        }

        // Animated Glass Water Caustics & Bubbles Canvas
        const canvas = document.getElementById('water-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const bubbles = [];
        let waveTime = 0;

        class WaterBubble {
            constructor(x, y, radius = null) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.radius = radius || Math.random() * 16 + 6;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = -Math.random() * 0.5 - 0.2;
                this.alpha = Math.random() * 0.4 + 0.25;
                this.color = ['#f7d0dc', '#EEF7F1', '#FEF9E7', '#e8dbd0'][Math.floor(Math.random() * 4)];
            }

            update() {
                this.x += this.vx + Math.sin(waveTime + this.y * 0.01) * 0.2;
                this.y += this.vy;
                if (this.y < -20) {
                    this.y = height + 20;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                // Glass bubble body
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha * 0.35;
                ctx.fill();

                // Liquid ring edge
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.stroke();

                // Refractive highlight arc
                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.globalAlpha = this.alpha * 0.85;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        for (let i = 0; i < 20; i++) {
            bubbles.push(new WaterBubble());
        }

        function addWaterBubble(x, y, size) {
            for (let i = 0; i < 5; i++) {
                const b = new WaterBubble(x + (Math.random() - 0.5) * 20, y + (Math.random() - 0.5) * 20, size * 0.35);
                b.vy = (Math.random() - 0.5) * 1.5;
                bubbles.push(b);
                if (bubbles.length > 35) bubbles.shift();
            }
        }

        function triggerSplashEffect() {
            addWaterBubble(width / 2, height / 2, 45);
        }

        function drawSoftWaterWaves() {
            waveTime += 0.015;
            ctx.save();
            ctx.globalAlpha = 0.06;
            ctx.fillStyle = '#f7d0dc';

            ctx.beginPath();
            ctx.moveTo(0, 0);
            for (let x = 0; x <= width; x += 20) {
                const y = Math.sin(x * 0.005 + waveTime) * 25 + Math.cos(x * 0.008 + waveTime * 0.8) * 15 + height * 0.3;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function animateWater() {
            ctx.clearRect(0, 0, width, height);
            drawSoftWaterWaves();

            bubbles.forEach(b => {
                b.update();
                b.draw();
            });

            requestAnimationFrame(animateWater);
        }

        window.onload = function() {
            render();
            animateWater();
        };

        window.addEventListener('click', (e) => {
            if (e.target.tagName !== 'INPUT' && !e.target.isContentEditable) {
                addWaterBubble(e.clientX, e.clientY, 20);
            }
        });
    </script>
</body>
</html>
